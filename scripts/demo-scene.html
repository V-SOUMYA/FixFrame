<!doctype html>
<html>
<head>
<meta charset="utf-8" />
<!-- Illustrated sample clip used for the reliable demo. Rendered to MP4 by scripts/render-demo.js. -->
<style>
  html, body { margin: 0; width: 1280px; height: 720px; overflow: hidden; background: #1b1d22; font-family: Inter, system-ui, sans-serif; }
  .scene { position: absolute; inset: 0; opacity: 0; }
  .s1 { animation: show 4s linear 0s both; }
  .s2 { animation: show 4s linear 4s both; }
  .s3 { animation: show 4.2s linear 8s both; }
  @keyframes show { 0% { opacity: 0; } 6% { opacity: 1; } 94% { opacity: 1; } 100% { opacity: 0; } }
  .s3 { animation-name: show3; }
  @keyframes show3 { 0% { opacity: 0; } 6% { opacity: 1; } 100% { opacity: 1; } }
  .cam { position: absolute; inset: 0; transform-origin: 50% 50%; }
  .s1 .cam { animation: push1 4s ease-in-out both; }
  .s2 .cam { animation: push2 4s ease-in-out 4s both; }
  .s3 .cam { animation: push3 4.2s ease-in-out 8s both; }
  @keyframes push1 { from { transform: scale(1); } to { transform: scale(1.06) translate(-6px, 4px); } }
  @keyframes push2 { from { transform: scale(1.02); } to { transform: scale(1.1) translate(10px, -4px); } }
  @keyframes push3 { from { transform: scale(1); } to { transform: scale(1.05); } }
  .drop { animation: drip 1.1s cubic-bezier(.55, 0, 1, .45) infinite; }
  .drop.d2 { animation-delay: .55s; }
  @keyframes drip { 0% { transform: translateY(0) scale(.4); opacity: 0; } 15% { transform: translateY(0) scale(1); opacity: 1; } 35% { transform: translateY(4px) scale(1, 1.2); } 100% { transform: translateY(150px) scale(1); opacity: .9; } }
  .seep { animation: seep 1.6s ease-in infinite; }
  .seep.b { animation-delay: .8s; }
  @keyframes seep { 0% { transform: translateY(0); opacity: 0; } 20% { opacity: 1; } 100% { transform: translateY(60px); opacity: 0; } }
  .ripple { animation: ripple 1.1s ease-out infinite; transform-origin: center; transform-box: fill-box; }
  @keyframes ripple { 0% { transform: scale(.2); opacity: .8; } 100% { transform: scale(1.6); opacity: 0; } }
  .grain { position: absolute; inset: 0; opacity: .06; background-image: radial-gradient(#fff 1px, transparent 1px); background-size: 3px 3px; mix-blend-mode: overlay; }
  .vignette { position: absolute; inset: 0; background: radial-gradient(ellipse at center, transparent 55%, rgba(0,0,0,.55) 100%); }
  .rec { position: absolute; top: 22px; left: 26px; color: #fff; font-size: 15px; letter-spacing: .08em; display: flex; gap: 8px; align-items: center; opacity: .85; }
  .rec i { width: 10px; height: 10px; border-radius: 50%; background: #ff3b3b; animation: blink 1s steps(2) infinite; }
  @keyframes blink { 50% { opacity: 0; } }
  body.fixed .drop, body.fixed .seep, body.fixed .ripple, body.fixed .wet, body.fixed .crack { display: none; }
</style>
</head>
<body>
<script>if (location.search.includes('fixed')) document.body.classList.add('fixed');</script>
  <!-- Scene 1: bathroom sink, faucet dripping while closed -->
  <div class="scene s1"><div class="cam">
    <svg width="1280" height="720" viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#cfd6d8"/><stop offset="1" stop-color="#aab3b6"/></linearGradient>
        <linearGradient id="chrome" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#f4f6f8"/><stop offset=".35" stop-color="#9aa3ab"/><stop offset=".6" stop-color="#e9edf0"/><stop offset="1" stop-color="#6d757d"/></linearGradient>
        <linearGradient id="basin" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#fbfbfa"/><stop offset="1" stop-color="#d9dcdc"/></linearGradient>
        <radialGradient id="bowl" cx=".5" cy=".35" r=".7"><stop offset="0" stop-color="#e8ecec"/><stop offset="1" stop-color="#b8bfc1"/></radialGradient>
        <linearGradient id="water" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e6f6ff"/><stop offset="1" stop-color="#8fc7e8"/></linearGradient>
      </defs>
      <rect width="1280" height="720" fill="url(#wall)"/>
      <g opacity=".25" stroke="#8e999c" stroke-width="2">
        <path d="M0 120H1280M0 240H1280M0 360H1280"/><path d="M160 0V360M480 0V360M800 0V360M1120 0V360"/>
      </g>
      <rect x="0" y="380" width="1280" height="340" fill="#5a4636"/>
      <rect x="0" y="380" width="1280" height="26" fill="#3f3127"/>
      <rect x="250" y="330" width="780" height="90" rx="20" fill="url(#basin)"/>
      <ellipse cx="640" cy="380" rx="300" ry="42" fill="url(#bowl)"/>
      <ellipse cx="640" cy="386" rx="34" ry="8" fill="#7d878b"/>
      <ellipse class="ripple" cx="640" cy="384" rx="26" ry="6" fill="none" stroke="#9fd2ef" stroke-width="2"/>
      <!-- faucet -->
      <rect x="600" y="250" width="80" height="90" rx="14" fill="url(#chrome)"/>
      <path d="M618 262 C 618 190, 760 180, 770 250 L 770 270 L 744 270 L 744 255 C 740 222, 650 222, 646 262 Z" fill="url(#chrome)"/>
      <rect x="738" y="266" width="40" height="14" rx="4" fill="#7c858d"/>
      <rect x="560" y="236" width="160" height="22" rx="11" fill="url(#chrome)"/>
      <circle cx="640" cy="247" r="16" fill="#c6cdd3" stroke="#8a939a" stroke-width="2"/>
      <!-- leak seeping at handle base -->
      <circle class="seep" cx="606" cy="262" r="4" fill="url(#water)"/>
      <circle class="seep b" cx="676" cy="262" r="3.5" fill="url(#water)"/>
      <!-- drips from spout -->
      <g transform="translate(758 284)">
        <path class="drop" d="M0 0 C 6 9, 8 14, 0 18 C -8 14, -6 9, 0 0 Z" fill="url(#water)"/>
      </g>
      <ellipse class="wet" cx="758" cy="374" rx="30" ry="6" fill="#9fd2ef" opacity=".35"/>
    </svg>
  </div></div>

  <!-- Scene 2: close-up of the handle base, water seeping from the cartridge -->
  <div class="scene s2"><div class="cam">
    <svg width="1280" height="720" viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="chrome2" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#ffffff"/><stop offset=".3" stop-color="#a2abb3"/><stop offset=".55" stop-color="#eef1f3"/><stop offset="1" stop-color="#5e666d"/></linearGradient>
        <linearGradient id="water2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#eefaff"/><stop offset="1" stop-color="#86c3e6"/></linearGradient>
        <radialGradient id="bg2" cx=".5" cy=".5" r=".8"><stop offset="0" stop-color="#c3cbce"/><stop offset="1" stop-color="#7f898d"/></radialGradient>
      </defs>
      <rect width="1280" height="720" fill="url(#bg2)"/>
      <rect x="0" y="540" width="1280" height="180" fill="#ecefef"/>
      <!-- handle -->
      <rect x="300" y="190" width="680" height="110" rx="55" fill="url(#chrome2)"/>
      <circle cx="640" cy="245" r="70" fill="#d2d8dd" stroke="#8b949b" stroke-width="4"/>
      <text x="640" y="262" text-anchor="middle" font-size="44" font-weight="700" fill="#9aa3aa">H</text>
      <!-- body -->
      <rect x="520" y="300" width="240" height="240" rx="26" fill="url(#chrome2)"/>
      <!-- worn seal ring -->
      <rect x="505" y="296" width="270" height="22" rx="11" fill="#4b5a62"/>
      <rect x="512" y="300" width="256" height="12" rx="6" fill="#2f3a40" opacity=".8"/>
      <path class="crack" d="M560 306 l14 -3 l10 4 l14 -5 l12 5" stroke="#1d2428" stroke-width="3" fill="none"/>
      <!-- seeping water -->
      <circle class="seep" cx="532" cy="320" r="10" fill="url(#water2)"/>
      <circle class="seep b" cx="748" cy="320" r="9" fill="url(#water2)"/>
      <circle class="seep" cx="640" cy="322" r="7" fill="url(#water2)" style="animation-delay:.4s"/>
      <path class="wet" d="M530 330 C 528 380, 534 430, 528 520" stroke="#a7dcf5" stroke-width="5" opacity=".55" fill="none"/>
      <path class="wet" d="M752 330 C 756 400, 748 460, 754 520" stroke="#a7dcf5" stroke-width="4" opacity=".5" fill="none"/>
      <ellipse class="wet" cx="640" cy="548" rx="200" ry="14" fill="#9fd2ef" opacity=".35"/>
      <!-- mineral scale -->
      <g fill="#e8e2cf" opacity=".85"><circle cx="560" cy="530" r="5"/><circle cx="580" cy="535" r="3"/><circle cx="700" cy="532" r="4"/></g>
    </svg>
  </div></div>

  <!-- Scene 3: under the sink, shutoff valve -->
  <div class="scene s3"><div class="cam">
    <svg width="1280" height="720" viewBox="0 0 1280 720">
      <defs>
        <linearGradient id="cab" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#3b3430"/><stop offset="1" stop-color="#231f1c"/></linearGradient>
        <linearGradient id="pipe" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#8b9399"/><stop offset=".5" stop-color="#e6eaed"/><stop offset="1" stop-color="#7b838a"/></linearGradient>
      </defs>
      <rect width="1280" height="720" fill="url(#cab)"/>
      <rect x="0" y="0" width="1280" height="60" fill="#181513"/>
      <!-- supply pipes -->
      <rect x="430" y="60" width="26" height="420" fill="url(#pipe)"/>
      <rect x="824" y="60" width="26" height="420" fill="url(#pipe)"/>
      <!-- shutoff valves -->
      <g transform="translate(443 480)">
        <rect x="-40" y="-26" width="80" height="52" rx="10" fill="#c9ced2"/>
        <rect x="-70" y="-10" width="140" height="20" rx="10" fill="#6f777d"/>
        <circle cx="0" cy="-48" r="30" fill="#c0c6ca" stroke="#7f878d" stroke-width="4"/>
        <path d="M-18 -48 H18" stroke="#7f878d" stroke-width="6" stroke-linecap="round"/>
      </g>
      <g transform="translate(837 480)">
        <rect x="-40" y="-26" width="80" height="52" rx="10" fill="#c9ced2"/>
        <rect x="-70" y="-10" width="140" height="20" rx="10" fill="#6f777d"/>
        <circle cx="0" cy="-48" r="30" fill="#c0c6ca" stroke="#7f878d" stroke-width="4"/>
        <path d="M-18 -48 H18" stroke="#7f878d" stroke-width="6" stroke-linecap="round"/>
      </g>
      <rect x="373" y="470" width="534" height="20" rx="10" fill="#5d656b" opacity=".6"/>
      <rect x="0" y="600" width="1280" height="120" fill="#16130f"/>
      <ellipse cx="640" cy="660" rx="260" ry="20" fill="#0d0b09"/>
    </svg>
  </div></div>

  <div class="grain"></div>
  <div class="vignette"></div>
  <div class="rec"><i></i>REC</div>
</body>
</html>
