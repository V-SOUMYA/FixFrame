<div id="stage"></div>
<script>
// ===================== helpers =====================
const clamp = (v, a = 0, b = 1) => Math.min(b, Math.max(a, v));
const lerp = (a, b, k) => a + (b - a) * k;
const ease = (k) => (k < .5 ? 2 * k * k : 1 - Math.pow(-2 * k + 2, 2) / 2);

const seg = (t, a, b, f = ease) => f(clamp((t - a) / (b - a)));
function key(t, frames, f = ease) {
  if (t <= frames[0][0]) return frames[0][1];
  for (let i = 1; i < frames.length; i++) {
    const [t1, v1] = frames[i];
    const [t0, v0] = frames[i - 1];
    if (t <= t1) {

}
function rnd(seed) { let s = seed * 9301 + 49297; s = (s * 233280 + 12345) % 233280; return s / 233280; }
const $ = (id) => document.getElementById(id);
const stage = $('stage');

// ===================== Frank =====================
const C = { skin: '#f0c29b', skin2: '#d9a57f', card: '#c8964a', card2: '#a8772f', pants: '#5d4636', pants2: '#4a3729', slip: '#8b3a2a', hair: '#a5a29b', ink: '#2a2622', shirt: '#efe9dc' };
function limb(len, w, col) { return `<line x1="0" y1="0" x2="0" y2="${len}" stroke="${col}" stroke-width="${w}" stroke-linecap="round"/>`; }
function frankSVG(p) {

    <g id="${p}-lL">${limb(96, 36, C.pants2)}<g id="${p}-kL" transform="translate(0 96)">${limb(88, 32, C.pants2)}<ellipse cx="16" cy="98" rx="30" ry="14" fill="${C.slip}" opacity=".85"/></g></g>
    <g id="${p}-t">
      <g id="${p}-aL" transform="translate(4 -128)">${limb(78, 28, C.card2)}<g id="${p}-eL" transform="translate(0 78)">${limb(70, 24, C.card2)}<circle cy="78" r="17" fill="${C.skin2}"/></g></g>
      <path d="M-44 -150 Q -48 -40 -40 14 L 46 14 Q 52 -40 44 -150 Q 0 -168 -44 -150 Z" fill="${C.card}"/>
      <path d="M-6 -150 L 2 -110 L 12 -150 Z" fill="${C.shirt}"/>

      <rect x="-44" y="-2" width="90" height="16" rx="6" fill="${C.card2}" opacity=".5"/>
      <g id="${p}-h" transform="translate(6 -168)">
        <rect x="-14" y="-10" width="28" height="26" rx="10" fill="${C.skin2}"/>

        <ellipse cx="-44" cy="-56" rx="12" ry="18" fill="${C.skin2}"/>
        <path d="M-58 -64 Q -64 -90 -46 -98 M -60 -46 Q -66 -40 -60 -30" stroke="${C.hair}" stroke-width="12" stroke-linecap="round" fill="none"/>
        <ellipse cx="-6" cy="-102" rx="22" ry="8" fill="#fff" opacity=".35"/>
        <g id="${p}-face">
          <path id="${p}-brow" d="M14 -88 Q 30 -96 46 -88" stroke="${C.hair}" stroke-width="7" stroke-linecap="round" fill="none"/>
          <circle cx="30" cy="-66" r="17" fill="#fff" fill-opacity=".25" stroke="${C.ink}" stroke-width="4"/>
          <path d="M13 -66 L -10 -64" stroke="${C.ink}" stroke-width="4"/>
          <g id="${p}-eyeN"><circle cx="33" cy="-66" r="5" fill="${C.ink}"/></g>
          <g id="${p}-eyeO" style="display:none"><circle cx="31" cy="-66" r="11" fill="#fff" stroke="${C.ink}" stroke-width="3"/><circle cx="33" cy="-66" r="4.5" fill="${C.ink}"/></g>
          <g id="${p}-eyeX" style="display:none"><path d="M24 -72 L 38 -60 M 38 -72 L 24 -60" stroke="${C.ink}" stroke-width="4" stroke-linecap="round"/></g>
          <g id="${p}-eyeH" style="display:none"><path d="M22 -64 Q 31 -74 40 -64" stroke="${C.ink}" stroke-width="4" stroke-linecap="round" fill="none"/></g>
          <path d="M50 -50 Q 58 -40 52 -32" stroke="${C.skin2}" stroke-width="7" stroke-linecap="round" fill="none"/>
          <g id="${p}-mSmile"><path d="M18 -18 Q 34 -8 48 -20" stroke="${C.ink}" stroke-width="5" stroke-linecap="round" fill="none"/></g>

          <g id="${p}-mGrin" style="display:none"><path d="M16 -24 Q 34 -2 52 -26 Z" fill="${C.ink}"/><path d="M20 -22 L 48 -24" stroke="#fff" stroke-width="5"/></g>
          <path d="M8 -34 Q 22 -46 36 -36 Q 50 -46 62 -32 Q 56 -22 36 -28 Q 16 -22 8 -34 Z" fill="${C.hair}"/>
          <g id="${p}-sweat" style="display:none"><path d="M-30 -110 Q -24 -96 -30 -88 Q -38 -96 -30 -110 Z" fill="#9fd3f0"/></g>

    </g>
    <g id="${p}-lR">${limb(96, 38, C.pants)}<g id="${p}-kR" transform="translate(0 96)">${limb(88, 34, C.pants)}<ellipse cx="16" cy="98" rx="32" ry="15" fill="${C.slip}"/></g></g>

}
const FACES = { eye: ['N', 'O', 'X', 'H'], mouth: ['Smile', 'O', 'Flat', 'Wob', 'Grin'] };
function pose(p, s) {
  const g = (id) => $(`${p}-${id}`);
  $(p).setAttribute('transform', `translate(${s.x} ${s.y}) rotate(${s.rot || 0}) scale(${s.sc || 1})`);
  g('t').setAttribute('transform', `rotate(${-(s.torso || 0)})`);
  g('h').setAttribute('transform', `translate(6 -168) rotate(${-(s.head || 0)})`);
  const arm = (k, [sh, el]) => { g('a' + k).setAttribute('transform', `translate(4 -128) rotate(${-sh})`); g('e' + k).setAttribute('transform', `translate(0 78) rotate(${-el})`); };
  arm('L', s.aL || [8, 10]); arm('R', s.aR || [-6, 10]);
  const leg = (k, [h, kn]) => { g('l' + k).setAttribute('transform', `rotate(${-h})`); g('k' + k).setAttribute('transform', `translate(0 96) rotate(${kn})`); };
  leg('L', s.lL || [0, 0]); leg('R', s.lR || [0, 0]);
  FACES.eye.forEach((e) => (g('eye' + e).style.display = (s.eye || 'N') === e ? '' : 'none'));
  FACES.mouth.forEach((m) => (g('m' + m).style.display = (s.mouth || 'Smile') === m ? '' : 'none'));
  g('sweat').style.display = s.sweat ? '' : 'none';

}
const STAND = { torso: 0, head: 0, aL: [8, 10], aR: [-6, 10], lL: [2, 0], lR: [-2, 0] };
const SIT = { torso: -6, head: 0, aL: [20, 40], aR: [26, 50], lL: [88, 92], lR: [92, 88] };
function blend(a, b, k) {
  const o = { ...b };
  for (const key in a) { if (typeof a[key] === 'number' && typeof b[key] === 'number') o[key] = lerp(a[key], b[key], k); else if (Array.isArray(a[key]) && Array.isArray(b[key])) o[key] = a[key].map((v, i) => lerp(v, b[key][i], k)); }

}
function walk(t, speed = 6) { const s = Math.sin(t * speed); return { lL: [s * 24, Math.max(0, -s) * 30], lR: [-s * 24, Math.max(0, s) * 30], aL: [-s * 18, 14], aR: [s * 18, 14], bob: Math.abs(Math.cos(t * speed)) * 6 }; }

// ===================== props =====================
const FLOOR = 900;
function room() {
  return `

    <linearGradient id="floorG" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a5c41"/><stop offset="1" stop-color="#4f3a28"/></linearGradient>

  <!-- stains -->

  <!-- peeling wallpaper corner -->

  <path d="M1330 180 L1460 290 M1460 180 L1330 290" stroke="#e7dcb6" stroke-width="22" opacity=".9"/>
  <!-- crooked picture -->

  <!-- ceiling drip + bucket -->

  <!-- floor -->
  <rect y="${FLOOR}" width="1920" height="${1080 - FLOOR}" fill="url(#floorG)"/>
  <g stroke="#3e2d1f" stroke-width="3" opacity=".6"><path d="M0 950 H1920 M0 1010 H1920 M240 900 V950 M760 950 V1010 M1300 900 V950 M1640 950 V1010"/></g>
  <rect y="${FLOOR - 16}" width="1920" height="18" fill="#5b4532"/>
  <!-- taped lamp -->
  <g transform="translate(1760 900)"><rect x="-8" y="-330" width="16" height="330" fill="#3c3a37"/><rect x="-22" y="-210" width="44" height="26" fill="#d6cfa4" transform="rotate(-20 0 -197)"/><path d="M-70 -330 L 70 -330 L 40 -420 L -40 -420 Z" fill="#e3c27d"/><ellipse cx="0" cy="0" rx="60" ry="12" fill="#3c3a37"/></g>
  <!-- crate table with coin jar -->
  <g transform="translate(720 900)"><rect x="-110" y="-160" width="220" height="160" fill="#a07a4c" stroke="#6f5232" stroke-width="6"/><path d="M-110 -110 H110 M-110 -60 H110" stroke="#6f5232" stroke-width="5"/>
    <g transform="translate(20 -160)"><rect x="-44" y="-96" width="88" height="96" rx="14" fill="#cfe4e6" opacity=".8" stroke="#8fa9ab" stroke-width="4"/><rect x="-48" y="-108" width="96" height="16" rx="5" fill="#b38f4a"/><g fill="#d9b245" stroke="#a8862b" stroke-width="2"><ellipse cx="-14" cy="-12" rx="16" ry="6"/><ellipse cx="12" cy="-18" rx="16" ry="6"/><ellipse cx="0" cy="-28" rx="16" ry="6"/></g></g></g>`;
}
function chairSVG(id, extra = '') {
  // Side view; seat top at y=0 local, legs to floor (+110), back posts up on the left.
  return `<g id="${id}">
    <g id="${id}-back"><rect x="-82" y="-250" width="18" height="260" rx="7" fill="#7a4a26"/><rect x="-90" y="-236" width="26" height="40" rx="8" fill="#8f5a30"/><rect x="-90" y="-160" width="26" height="34" rx="8" fill="#8f5a30"/></g>

    <g id="${id}-legF"><rect x="62" y="10" width="18" height="102" rx="6" fill="#7a4a26"/></g>

function caption(text, t, a, b) {
  const k = Math.min(seg(t, a, a + .3, easeOut), 1 - seg(t, b - .25, b));

}
function stamp(text, t, a, x, y, rot = -8) {
  if (t < a) return '';
  const k = seg(t, a, a + .18, easeOut);
  return `<div class="stamp" style="left:${x}px;top:${y}px;transform:rotate(${rot}deg) scale(${lerp(2.4, 1, k)});opacity:${k}">${text}</div>`;

function dust(cx, cy, t, a) {

  let s = '';
  for (let i = 0; i < 9; i++) {
    const ang = (i / 9) * Math.PI + Math.PI;
    const r = 30 + k * 170 * (0.6 + rnd(i + 3) * .6);
    s += `<circle cx="${cx + Math.cos(ang) * r}" cy="${cy + Math.sin(ang) * r * .45}" r="${22 + k * 30}" fill="#d8ccb2" opacity="${(1 - k) * .8}"/>`;
  }

}

// ===================== scenes =====================
const S = {};

// ---- 1. Meet Frank, the fall, the menu ----
S.intro = {
  dur: 13.5,
  build() {
    stage.innerHTML = `<svg viewBox="0 0 1920 1080" id="sv"><g id="world">${room()}<g id="chairW" transform="translate(1060 790)">${chairSVG('ch')}</g><g id="dustL"></g>${frankSVG('F')}<g id="fx"></g><g id="coin"></g></g></svg><div id="ov"></div><div class="grain"></div>`;
  },
  update(t) {
    // drip
    const dk = (t % 1.6) / 1.6;
    $('drip').setAttribute('cy', 30 + dk * 760); $('drip').setAttribute('opacity', dk < .95 ? 1 : 0);
    let fx = '', ov = '';
    // Frank: counting coins (0-5.5), walk (5.5-7.6), turn+sit (7.6-8.6), crash 9.0
    let P;
    if (t < 5.6) {
      const c = Math.sin(t * 5) * .5 + .5;
      P = { ...STAND, x: 520, y: FLOOR - 197, aR: [62 + c * 14, 30 + c * 22], aL: [30, 60], head: -10 + c * 4, mouth: t > 3.2 ? 'Grin' : 'Smile' };
      if (t > .6 && t < 5.2 && (t * 2.5) % 1 < .5) {
        const k = ((t * 2.5) % 1) * 2;
        $('coin').innerHTML = `<ellipse cx="${740}" cy="${600 + k * 90}" rx="13" ry="5" fill="#d9b245" stroke="#a8862b" stroke-width="2"/>`;
      } else $('coin').innerHTML = '';
    } else if (t < 7.6) {
      $('coin').innerHTML = '';
      const k = seg(t, 5.6, 7.6, (x) => x);
      const w = walk(t);
      P = { ...STAND, ...w, x: lerp(520, 1010, k), y: FLOOR - 197 - w.bob, mouth: 'Smile' };
    } else {
      const k = seg(t, 7.6, 8.5);
      P = blend({ ...STAND, x: 1010, y: FLOOR - 197 }, { ...SIT, x: 1000, y: 780 }, k);
      P.mouth = 'Smile'; P.eye = 'H';
    }
    // chair + crash
    const crash = 9.0;
    let chairRot = 0, legB = '';
    if (t >= crash) {
      const k = seg(t, crash, crash + .45, easeIn);
      chairRot = -k * 34 + (t > crash + .45 ? Math.sin((t - crash - .45) * 18) * 3 * Math.max(0, 1 - (t - crash - .45) * 2) : 0);
      const lk = seg(t, crash, crash + .6, easeOut);
      legB = `translate(${-lk * 260} ${lk * 60 - Math.sin(lk * Math.PI) * 140}) rotate(${-lk * 300} -69 60)`;
      const fk = seg(t, crash, crash + .42, easeIn);
      P = blend({ ...SIT, x: 1000, y: 780 }, { torso: 0, head: 10, aL: [70, 30], aR: [55, 20], lL: [150, 40], lR: [130, 60], x: 930, y: FLOOR - 40, rot: -90 }, fk);
      P.rot = lerp(0, -90, fk); P.eye = t > crash + .5 ? 'X' : 'O'; P.mouth = 'O';
      if (t > crash + .42) { const b = Math.max(0, 1 - (t - crash - .42) * 3); P.y -= Math.abs(Math.sin((t - crash) * 20)) * 24 * b; }
      fx += dust(980, FLOOR, t, crash + .4) + burst('CRASH!', 1240, 520, t, crash + .38, 1.2);
    }
    $('ch').setAttribute('transform', `rotate(${chairRot} 80 112)`);
    $('ch-legB').setAttribute('transform', legB);
    pose('F', P);
    $('fx').innerHTML = fx;
    // freeze + menu
    const fz = 10.6;
    const [sx, sy] = shake(t, crash + .4);
    $('world').setAttribute('transform', `translate(${sx} ${sy})`);
    $('sv').style.filter = t > fz ? `grayscale(${seg(t, fz, fz + .3)}) blur(${seg(t, fz + .4, fz + .9) * 6}px) brightness(${1 - seg(t, fz + .4, fz + .9) * .45})` : 'none';
    ov += caption('Meet Frank.', t, .4, 3.0) + caption('Frank does not spend money.', t, 3.1, 5.6);
    if (t > fz + .5) ov += menu(t - (fz + .5), 'A');
    $('ov').innerHTML = ov;
  },
};

function menu(t, pick) {
  const k = seg(t, 0, .35, easeOut);
  const idx = { A: 0, B: 1, C: 2 }[pick];
  const hot = t > 1.05;
  const opts = [['A', 'Buy a new chair'], ['B', 'Watch a tutorial'], ['C', 'Film it with FixFrame']];
  const cards = opts.map(([kk, l], i) => `<div class="opt ${hot && i === idx ? 'hot' : ''} ${hot && i !== idx && t > 1.4 ? 'dim' : ''}" style="opacity:${seg(t, .1 + i * .12, .4 + i * .12)};transform:translateY(${(1 - seg(t, .1 + i * .12, .4 + i * .12, easeOut)) * 40}px) scale(${hot && i === idx ? 1 + seg(t, 1.05, 1.25) * .06 : 1})"><span class="k">Option ${kk}</span><span class="l">${l}</span></div>`).join('');
  const cx = key(t, [[.3, 1700], [1.0, 470 + idx * 500 + 60]]);
  const cy = key(t, [[.3, 980], [1.0, 640]]);
  const ring = t > 1.0 && t < 1.5 ? `<div class="ring" style="left:${cx - 20}px;top:${cy - 20}px;transform:scale(${1 + (t - 1) * 3});opacity:${1 - (t - 1) * 2}"></div>` : '';
  return `<div class="menu" style="opacity:${k}"><h2>Frank has three options.</h2><div class="opts">${cards}</div></div>
    <svg class="cursor" style="left:${cx}px;top:${cy}px" viewBox="0 0 24 24"><path d="M3 2 L 3 19 L 8 14 L 11.5 21 L 14 20 L 10.6 13 L 17 13 Z" fill="#fff" stroke="#111" stroke-width="1.4"/></svg>${ring}`;
}

    else if (t < 2.6) { P = blend({ ...STAND, x: 1010, y: FLOOR - 197 }, { ...SIT, x: 1000, y: 780 }, seg(t, 1.4, 2.6, (k) => easeIn(k) * .7 + k * .3)); P.eye = 'O'; P.mouth = 'Flat'; P.band = true; }
    else if (t < 4.6) { P = { ...SIT, x: 1000, y: 780, eye: t > 3.6 ? 'H' : 'O', mouth: t > 3.6 ? 'Smile' : 'Flat', band: true, sweat: t < 3.6 }; }
    else { P = { ...SIT, x: 1000, y: 780, torso: -14, head: 8, aL: [150, 120], aR: [150, 130], lL: [100, 70], lR: [70, 40], eye: 'H', mouth: 'Grin', band: true }; }
    pose('F', P);
    // sparkle on chair + coin toss to jar
    $('spark').innerHTML = t > 4.6 && t < 6 ? [0, 1, 2].map((i) => `<text x="${940 + i * 120}" y="${700 - i * 30}" font-size="${60 * seg(t, 4.6 + i * .15, 4.9 + i * .15, easeOut)}" fill="#f3d58b">✦</text>`).join('') : '';
    if (t > 6 && t < 7.2) {
      const k = seg(t, 6, 7.0, (x) => x);
      $('coin').innerHTML = `<ellipse cx="${lerp(1040, 740, k)}" cy="${lerp(560, 650, k) - Math.sin(k * Math.PI) * 260}" rx="14" ry="${5 + Math.abs(Math.sin(k * 20)) * 9}" fill="#d9b245" stroke="#a8862b" stroke-width="2"/>`;
    } else $('coin').innerHTML = '';
    let ov = caption('Holds. Totally solid.', t, 3.7, 5.9) + caption('$9. Frank approves.', t, 6.1, 9.4);
    $('ov').innerHTML = ov;
    // end card
    const e = seg(t, 9.6, 10.3);
    $('endc').innerHTML = e > 0 ? `<div class="end" style="opacity:${e}"><div class="logo"><i><svg width="50" height="50" viewBox="0 0 24 24" fill="none" stroke="#dfe5d6" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round"><path d="M14.7 6.3a4 4 0 0 0-5.4 5.4L3 18l3 3 6.3-6.3a4 4 0 0 0 5.4-5.4l-2.6 2.6-2.4-.6-.6-2.4z"/></svg></i>fixframe</div>
      <h1 style="opacity:${seg(t, 10.2, 10.8)}">Don't replace it.<br><em>Film it.</em></h1>
      <div class="stack" style="opacity:${seg(t, 11, 11.6)}">PayPal · Channel3 · AG Grid · Render</div></div>` : '';
  },
};

// ===================== driver =====================
const name = new URLSearchParams(location.search).get('scene') || 'intro';
window.SCENE = S[name];
window.SCENE.build();
window.render = (t) => window.SCENE.update(t);
window.render(Number(new URLSearchParams(location.search).get('t') || 0));
</script>
</body>
