<!doctype html>
<html><head><meta charset="utf-8"><style>
html,body{margin:0;width:1280px;height:720px;overflow:hidden;background:#2a2622;font-family:system-ui,sans-serif}
.s{position:absolute;inset:0;opacity:0}
.s1{animation:show 4s linear 0s both}.s2{animation:show 3.6s linear 4s both}.s3{animation:show3 3.4s linear 7.6s both}
@keyframes show{0%{opacity:0}6%{opacity:1}94%{opacity:1}100%{opacity:0}}
@keyframes show3{0%{opacity:0}8%{opacity:1}100%{opacity:1}}
.cam{position:absolute;inset:0}
.s1 .cam{animation:p1 4s ease-in-out both}.s2 .cam{animation:p2 3.6s ease-in-out 4s both}.s3 .cam{animation:p3 3.4s ease-in-out 7.6s both}
@keyframes p1{from{transform:scale(1)}to{transform:scale(1.05) translate(-8px,4px)}}
@keyframes p2{from{transform:scale(1.02)}to{transform:scale(1.1) translate(12px,-6px)}}
@keyframes p3{from{transform:scale(1)}to{transform:scale(1.06)}}
.rock{transform-origin:640px 600px;animation:rock 1.1s ease-in-out infinite}
@keyframes rock{0%,100%{transform:rotate(-2.2deg)}50%{transform:rotate(2.2deg)}}
.hand{animation:push 1.1s ease-in-out infinite}
@keyframes push{0%,100%{transform:translateX(-8px)}50%{transform:translateX(14px)}}
.gap{animation:gap 1.1s ease-in-out infinite;transform-origin:640px 330px}
@keyframes gap{0%,100%{transform:rotate(-3deg) translateX(-4px)}50%{transform:rotate(3deg) translateX(6px)}}
.dust{animation:dust 2s ease-in infinite}.dust.b{animation-delay:1s}
@keyframes dust{0%{transform:translateY(0);opacity:0}20%{opacity:.8}100%{transform:translateY(80px);opacity:0}}
.vig{position:absolute;inset:0;background:radial-gradient(ellipse at center,transparent 55%,rgba(0,0,0,.55) 100%)}
.grain{position:absolute;inset:0;opacity:.07;background-image:radial-gradient(#fff 1px,transparent 1px);background-size:3px 3px;mix-blend-mode:overlay}
.rec{position:absolute;top:22px;left:26px;color:#fff;font-size:15px;letter-spacing:.08em;display:flex;gap:8px;align-items:center;opacity:.85}
.rec i{width:10px;height:10px;border-radius:50%;background:#ff3b3b;animation:bl 1s steps(2) infinite}@keyframes bl{50%{opacity:0}}
.fixed .rock,.fixed .gap{animation:none}
.fixed .jointgap,.fixed .flake,.fixed .dust,.fixed .hole{display:none}
.fixed .screw{transform:none}
.fillhole{display:none}.fixed .fillhole{display:inline}
</style></head><body>
<script>if(location.search.includes('fixed'))document.documentElement.classList.add('fixed');</script>
<!-- Scene 1: whole chair rocking when pushed -->
<div class="s s1"><div class="cam"><svg width="1280" height="720">
<defs>
<linearGradient id="wall" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#d9d2c4"/><stop offset="1" stop-color="#bdb4a3"/></linearGradient>
<linearGradient id="wood" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#7a4a26"/><stop offset=".5" stop-color="#a26a3c"/><stop offset="1" stop-color="#6b3f20"/></linearGradient>
<linearGradient id="seat" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b47b48"/><stop offset="1" stop-color="#875230"/></linearGradient>
<linearGradient id="floor" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#8d6b4c"/><stop offset="1" stop-color="#5a4330"/></linearGradient>
</defs>
<rect width="1280" height="720" fill="url(#wall)"/>
<rect y="560" width="1280" height="160" fill="url(#floor)"/>
<g stroke="#4a3626" stroke-opacity=".35"><path d="M0 600H1280M0 650H1280M0 700H1280"/></g>
<ellipse cx="640" cy="608" rx="200" ry="16" fill="#000" opacity=".25"/>
<g class="rock">
 <rect x="490" y="150" width="22" height="300" rx="8" fill="url(#wood)"/>
 <rect x="768" y="150" width="22" height="300" rx="8" fill="url(#wood)"/>
 <rect x="500" y="170" width="280" height="34" rx="10" fill="url(#wood)"/>
 <rect x="500" y="250" width="280" height="22" rx="8" fill="url(#wood)"/>
 <path d="M470 390 L810 390 L790 440 L490 440 Z" fill="url(#seat)"/>
 <rect x="480" y="440" width="320" height="18" rx="4" fill="#6b3f20"/>
 <rect x="500" y="456" width="20" height="150" rx="6" fill="url(#wood)"/>
 <rect x="760" y="456" width="20" height="150" rx="6" fill="url(#wood)"/>
 <rect x="560" y="456" width="16" height="130" rx="6" fill="#6b3f20"/>
 <rect x="706" y="456" width="16" height="130" rx="6" fill="#6b3f20"/>
 <rect x="512" y="540" width="256" height="10" rx="4" fill="#6b3f20"/>
 <!-- visible gap at front-left leg joint -->
 <path class="jointgap" d="M500 452 L522 452 L524 470 L498 466 Z" fill="#2a1a10"/>
</g>
<g class="hand"><path d="M860 380 C 830 370, 810 380, 800 395 L 860 420 C 900 425, 960 410, 1000 400 L 1000 370 Z" fill="#c8977a"/><path d="M800 395 C 790 400, 792 410, 804 412 L 830 410" fill="#b9856a"/></g>
</svg></div></div>

<!-- Scene 2: close-up of the loose leg joint -->
<div class="s s2"><div class="cam"><svg width="1280" height="720">
<defs>
<linearGradient id="w2" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#6e4122"/><stop offset=".45" stop-color="#a8703f"/><stop offset="1" stop-color="#5f381c"/></linearGradient>
<linearGradient id="seat2" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#b07644"/><stop offset="1" stop-color="#7e4b2b"/></linearGradient>
<radialGradient id="bg2" cx=".5" cy=".4" r=".8"><stop offset="0" stop-color="#cfc6b5"/><stop offset="1" stop-color="#8e8473"/></radialGradient>
</defs>
<rect width="1280" height="720" fill="url(#bg2)"/>
<rect y="600" width="1280" height="120" fill="#6a503a"/>
<rect x="300" y="180" width="680" height="120" rx="14" fill="url(#seat2)"/>
<g stroke="#6a3f20" stroke-opacity=".5" fill="none"><path d="M320 210 C 500 200, 700 220, 960 205"/><path d="M320 250 C 520 262, 760 240, 960 255"/></g>
<g class="gap">
 <rect x="590" y="318" width="100" height="300" rx="16" fill="url(#w2)"/>
 <g stroke="#4a2a14" stroke-opacity=".45" fill="none"><path d="M610 340 C 615 420, 605 500, 612 600"/><path d="M660 340 C 655 430, 668 520, 660 600"/></g>
</g>
<!-- joint gap and loose screw -->
<path class="jointgap" d="M580 300 L700 300 L706 322 L574 330 Z" fill="#1a100a"/>
<rect class="jointgap" x="628" y="296" width="12" height="40" rx="3" fill="#9aa1a6" transform="rotate(12 634 316)"/>
<circle cx="636" cy="298" r="9" fill="#c2c8cc" stroke="#7d8489" stroke-width="2"/>
<path d="M631 298 h10" stroke="#6c7378" stroke-width="2"/>
<!-- old dried glue flakes -->
<g class="flake" fill="#e7d9a9" opacity=".9"><circle cx="596" cy="326" r="4"/><circle cx="688" cy="324" r="3"/><circle cx="604" cy="318" r="2.5"/></g>
<circle class="dust" cx="602" cy="340" r="3" fill="#e7d9a9"/><circle class="dust b" cx="684" cy="338" r="2.5" fill="#e7d9a9"/>
</svg></div></div>

<!-- Scene 3: underside, corner bracket missing one screw -->
<div class="s s3"><div class="cam"><svg width="1280" height="720">
<defs><linearGradient id="u" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7a4b2a"/><stop offset="1" stop-color="#5b371e"/></linearGradient></defs>
<rect width="1280" height="720" fill="#2b2420"/>
<rect x="160" y="80" width="960" height="520" rx="18" fill="url(#u)"/>
<g stroke="#4a2c16" stroke-opacity=".5" fill="none"><path d="M180 160 C 500 150, 800 175, 1100 160"/><path d="M180 300 C 520 315, 780 290, 1100 305"/><path d="M180 460 C 480 450, 820 470, 1100 455"/></g>
<!-- leg tops in corners -->
<rect x="200" y="120" width="110" height="110" rx="14" fill="#9c6537"/>
<rect x="970" y="120" width="110" height="110" rx="14" fill="#9c6537"/>
<rect x="200" y="450" width="110" height="110" rx="14" fill="#9c6537"/>
<rect x="970" y="450" width="110" height="110" rx="14" fill="#9c6537"/>
<!-- corner brackets -->
<g fill="#b9bfc4" stroke="#7a8086" stroke-width="2">
 <path d="M320 140 L420 140 L320 240 Z"/><path d="M960 140 L860 140 L960 240 Z"/>
 <path d="M320 540 L420 540 L320 440 Z"/><path d="M960 540 L860 540 L960 440 Z"/>
</g>
<g fill="#6c7378"><circle cx="345" cy="165" r="7"/><circle cx="935" cy="165" r="7"/><circle cx="935" cy="515" r="7"/><circle cx="345" cy="515" r="7"/>
<circle cx="385" cy="165" r="7"/><circle cx="895" cy="165" r="7"/><circle cx="895" cy="515" r="7"/></g>
<!-- empty screw hole on front-left bracket -->
<circle class="hole" cx="385" cy="515" r="8" fill="#1a120c" stroke="#7a8086" stroke-width="2"/><circle class="fillhole" cx="385" cy="515" r="7" fill="#6c7378"/>
<!-- bracket bent away from the rail -->
<path d="M320 540 L420 540 L320 440 Z" fill="none" stroke="#e8c070" stroke-opacity="0"/>
</svg></div></div>
<div class="grain"></div><div class="vig"></div><div class="rec"><i></i>REC</div>
</body></html>
